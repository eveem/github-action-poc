name: List PR Commits on Merge

on:
  push:
    branches:
      - main

jobs:
  list-pr-commits:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Find merged PR and list commits
        run: |
          # Find the PR associated with the merge commit SHA
          PR_NUMBER=$(gh api repos/${{ github.repository }}/commits/${{ github.sha }}/pulls \
            --header "Accept: application/vnd.github+json" \
            --jq '.[0].number')

          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then
            echo "No PR found for commit ${{ github.sha }} (possibly a direct push)"
            exit 0
          fi

          echo "PR #$PR_NUMBER was merged into main"
          echo ""

          # Extract all commit messages
          COMMITS=$(gh pr view $PR_NUMBER --json commits --jq '[.commits[].messageHeadline]')

          echo "Commits in PR #$PR_NUMBER:"
          echo "$COMMITS" | jq -r '.[] | "- \(.)"'
          echo ""

          # Extract unique ticket IDs matching VND-XXXX pattern
          TICKETS=$(echo "$COMMITS" | grep -oE 'VND-[0-9]+' | sort -u)

          if [ -z "$TICKETS" ]; then
            echo "No ticket IDs found in commits"
          else
            echo "Ticket IDs referenced in this PR:"
            echo "$TICKETS" | while read -r ticket; do
              echo "  - $ticket"
            done
          fi
